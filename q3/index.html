<!DOCTYPE html>
<html>
<head>
    <title>Student Timetable</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Weekly Schedule</h1>
        <p id="current-day"></p>

        <table id="timetable">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                    <th>Wednesday</th>
                    <th>Thursday</th>
                    <th>Friday</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="time">09:00 - 10:00</td>
                    <td class="math">Mathematics</td>
                    <td class="physics">Physics</td>
                    <td class="math">Mathematics</td>
                    <td class="cs">Computer Science</td>
                    <td class="physics">Physics</td>
                </tr>
                <tr>
                    <td class="time">10:00 - 11:00</td>
                    <td class="cs">Computer Science</td>
                    <td class="math">Mathematics</td>
                    <td class="english">English</td>
                    <td class="cs">Lab Work</td>
                    <td class="math">Mathematics</td>
                </tr>
                <tr>
                    <td class="time">11:00 - 12:00</td>
                    <td class="english">English</td>
                    <td class="cs">Data Structures</td>
                    <td class="physics">Physics Lab</td>
                    <td class="math">Mathematics</td>
                    <td class="english">Seminar</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
