<!DOCTYPE html>
<html>
<head>
    <title>Course Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <h2>Student Course Registration</h2>
        <form id="registrationForm">
            <!-- Student Details -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@college.com" required>
            </div>

            <!-- Course Selection -->
            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course" required>
                    <option value="">-- Choose a Course --</option>
                    <option value="cs">Computer Science</option>
                    <option value="it">Information Technology</option>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="ds">Data Science</option>
                </select>
            </div>

            <div class="form-group">
                <label>Semester</label>
                <div class="radio-group">
                    <input type="radio" name="semester" value="Fall" id="fall" checked> <label for="fall">Fall</label>
                    <input type="radio" name="semester" value="Spring" id="spring"> <label for="spring">Spring</label>
                </div>
            </div>

            <div class="form-group">
                <label><input type="checkbox" id="terms" required> I agree to the terms and conditions</label>
            </div>

            <button type="submit">Register Now</button>
        </form>

        <!-- Feedback Message -->
        <div id="message" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
